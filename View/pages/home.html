<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-teal-50">
    <nav class="bg-teal-700 p-4 flex justify-between items-center text-white">
      <h1 class="text-xl font-bold">Dashboard</h1>
      <button
        id="logoutBtn"
        class="bg-white text-teal-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition-all"
      >
        Logout
      </button>
    </nav>

    <section
      id="dashboardSection"
      class="max-w-2xl mx-auto bg-white shadow-xl rounded-2xl mt-10 p-8 hidden"
    >
      <h2 class="text-2xl font-bold text-teal-700 mb-4">Welcome</h2>
      <p id="userInfo" class="text-gray-700"></p>
    </section>

    <section id="unauthorized" class="text-center mt-20 text-gray-600 hidden">
      <p>Access denied. Redirecting to login...</p>
    </section>

    <!-- ✅ Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../scripts/home.js"></script>
  </body>
</html>
