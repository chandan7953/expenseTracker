<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-teal-50">
    <nav class="bg-teal-700 p-4 flex justify-between items-center text-white">
      <h1 class="text-xl font-bold">Dashboard</h1>
      <form action="/logout" method="POST">
        <button
          type="submit"
          class="bg-white text-teal-700 px-4 py-2 rounded-lg hover:bg-gray-200"
        >
          Logout
        </button>
      </form>
    </nav>

    <section class="max-w-2xl mx-auto bg-white shadow-xl rounded-2xl mt-10 p-8">
      <h2 class="text-2xl font-bold text-teal-700 mb-4">Welcome</h2>
    </section>

    <script>
      // Example: if you fetch user details from API after login
      fetch("/user-details")
        .then((res) => res.json())
        .then((user) => {
          document.getElementById("username").textContent = user.username;
          document.getElementById("email").textContent = user.email;
          document.getElementById("phone").textContent = user.phone;
        })
        .catch(() => console.log("User not logged in"));
    </script>
  </body>
</html>
