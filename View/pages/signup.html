<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup | Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-teal-50">
    <div class="bg-white shadow-2xl rounded-2xl w-96 p-8">
      <h2 class="text-2xl font-bold text-center text-teal-700 mb-6">
        Create Account
      </h2>

      <form action="/register" method="POST" class="space-y-4">
        <input
          type="text"
          name="username"
          placeholder="Username"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
          required
        />

        <input
          type="email"
          name="email"
          placeholder="Email"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
          required
        />

        <input
          type="text"
          name="phone"
          placeholder="Phone Number"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
          required
        />

        <input
          type="password"
          name="password"
          placeholder="Password"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
          required
        />

        <button
          type="submit"
          class="w-full bg-teal-600 text-white p-3 rounded-lg hover:bg-teal-700 transition-all"
        >
          Sign Up
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-4">
        Already have an account?
        <a href="login.html" class="text-teal-600 font-semibold hover:underline"
          >Login</a
        >
      </p>
    </div>
  </body>
</html>
