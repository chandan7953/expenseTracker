<section
  id="reportSection"
  class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg"
>
  <h1 class="text-2xl font-bold text-teal-700 mb-4">Expense Report</h1>

  <!-- Buy Pro Card -->
  <div id="buyProCard" class="text-center hidden">
    <h3 class="text-2xl font-semibold text-teal-700 mb-3">
      Unlock Pro Features 🚀
    </h3>
    <p id="proText" class="text-gray-600 mb-4">
      You need a Pro subscription to view this report.
    </p>
    <button
      id="buyProBtn"
      class="bg-teal-600 hover:bg-teal-700 text-white font-semibold px-6 py-3 rounded-xl transition-all"
    >
      Buy Pro
    </button>
  </div>

  <div id="mainContent" class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="font-semibold text-gray-700">Start Date</label>
        <input
          type="date"
          id="startDate"
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-teal-500"
        />
      </div>
      <div>
        <label class="font-semibold text-gray-700">End Date</label>
        <input
          type="date"
          id="endDate"
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-teal-500"
        />
      </div>
      <div class="flex items-end">
        <button
          id="filterBtn"
          class="w-full bg-teal-600 text-white p-3 rounded-lg hover:bg-teal-700 transition"
        >
          Filter
        </button>
      </div>
    </div>

    <div class="mt-6 overflow-x-auto">
      <table class="w-full border-collapse" id="expenseTable">
        <thead>
          <tr class="bg-teal-600 text-white text-center">
            <th class="p-3">Date</th>
            <th class="p-3">Amount</th>
            <th class="p-3">Description</th>
            <th class="p-3">Category</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="text-gray-700 text-center"></tbody>
      </table>
    </div>

    <h2 id="total" class="text-right font-bold mt-4"></h2>

    <div class="flex justify-between mt-4">
      <button
        id="downloadBtn"
        class="bg-teal-600 text-white px-6 py-2 rounded-lg hover:bg-teal-700"
      >
        Download PDF
      </button>
    </div>
  </div>
</section>
