<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  </head>
  <body class="bg-gray-100 min-h-screen p-6">
    <div
      id="mainContent"
      class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg hidden"
    >
      <h1 class="text-2xl font-bold text-teal-700 mb-4">Expense Report</h1>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="font-semibold text-gray-700">Start Date</label>
          <input
            type="date"
            id="startDate"
            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-teal-500"
          />
        </div>
        <div>
          <label class="font-semibold text-gray-700">End Date</label>
          <input
            type="date"
            id="endDate"
            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-teal-500"
          />
        </div>
        <div class="flex items-end">
          <button
            id="filterBtn"
            class="w-full bg-teal-600 text-white p-3 rounded-lg hover:bg-teal-700 transition"
          >
            Filter
          </button>
        </div>
      </div>

      <div
        id="loader"
        class="hidden text-center mt-4 text-teal-600 font-semibold"
      >
        Loading...
      </div>

      <div class="mt-6 overflow-x-auto">
        <table class="w-full border-collapse" id="expenseTable">
          <thead>
            <tr class="bg-teal-600 text-white text-center">
              <th class="p-3">Date</th>
              <th class="p-3">Amount</th>
              <th class="p-3">Description</th>
              <th class="p-3">Category</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="text-gray-700 text-center"></tbody>
        </table>
      </div>

      <h2 id="total" class="text-right font-bold mt-4"></h2>

      <div class="flex justify-between mt-4">
        <button
          id="downloadBtn"
          class="bg-teal-600 text-white px-6 py-2 rounded-lg hover:bg-teal-700 hidden"
        >
          Download PDF
        </button>
        <a
          href="/"
          class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600"
          >Home</a
        >
      </div>
    </div>

    <div
      id="proCard"
      class="hidden max-w-md mx-auto bg-yellow-50 border-l-4 border-yellow-500 p-8 rounded-lg shadow-lg text-center"
    >
      <h2 class="text-3xl font-bold text-yellow-800 mb-4">Access Denied</h2>
      <p class="text-yellow-700 mb-6 text-lg">
        You need a Pro subscription to access this feature.
      </p>
      <a
        href="http://localhost:3000/?tab=leaderboard"
        class="inline-block bg-yellow-500 text-white font-semibold px-6 py-3 rounded-lg hover:bg-yellow-600 transition mr-2"
        >Buy Pro</a
      >
      <a
        href="/"
        class="inline-block bg-gray-500 text-white font-semibold px-6 py-3 rounded-lg hover:bg-gray-600 transition"
        >Home</a
      >
    </div>

    <script src="./scripts/expensereport.js"></script>
  </body>
</html>
