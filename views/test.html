<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-teal-50">
    <!-- Navbar -->
    <nav class="bg-teal-700 p-4 flex justify-between items-center text-white">
      <h1 class="text-xl font-bold">Dashboard</h1>
      <button
        id="logoutBtn"
        class="bg-white text-teal-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition-all"
      >
        Logout
      </button>
    </nav>

    <!-- Dashboard -->
    <section
      id="dashboardSection"
      class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl mt-10 p-8"
    >
      <h3 class="text-xl font-semibold text-teal-600 mb-4">Add Expense</h3>

      <!-- Inline Add Expense Form -->
      <form id="expenseForm" class="grid grid-cols-4 gap-4 items-end mb-8">
        <input
          type="number"
          id="amount"
          name="amount"
          class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none"
          placeholder="Amount"
          required
        />
        <input
          type="text"
          id="description"
          name="description"
          class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none"
          placeholder="Description"
          required
        />
        <select
          id="category"
          name="category"
          class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none"
          required
        >
          <option value="">Category</option>
          <option value="Food">Food</option>
          <option value="Petrol">Petrol</option>
          <option value="Salary">Salary</option>
          <option value="Shopping">Shopping</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
        <button
          type="submit"
          class="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 rounded-lg transition"
        >
          Add
        </button>
      </form>

      <!-- Expenses List -->
      <ul id="expenseList" class="space-y-3 mb-8">
        <!-- Dynamic expense items will appear here -->
      </ul>

      <!-- Pagination -->
      <nav id="pagination" class="flex justify-center mt-6">
        <ul class="flex space-x-2" id="paginationList"></ul>
      </nav>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      const apiUrl = "http://localhost:3000/api/expenses";
      const expenseForm = document.getElementById("expenseForm");
      const expenseList = document.getElementById("expenseList");
      const paginationList = document.getElementById("paginationList");

      let currentPage =
        parseInt(new URLSearchParams(window.location.search).get("page")) || 1;
      const totalPages = 10; // Example: 10 pages total
      const limit = 5;

      // Load Expenses
      async function loadExpenses(page = 1) {
        // Example static data (replace with backend API)
        const response = {
          data: {
            expenses: Array.from({ length: limit }, (_, i) => ({
              id: (page - 1) * limit + i + 1,
              amount: Math.floor(Math.random() * 1000),
              description: "Sample expense " + ((page - 1) * limit + i + 1),
              category: ["Food", "Petrol", "Shopping"][i % 3],
            })),
          },
        };

        const expenses = response.data.expenses;
        expenseList.innerHTML = expenses
          .map(
            (e) => `
              <li class="border border-gray-200 rounded-lg p-4 flex justify-between items-center shadow-sm">
                <div>
                  <p class="font-semibold text-teal-700">₹${e.amount}</p>
                  <p class="text-gray-600 text-sm">${e.description}</p>
                  <p class="text-xs text-gray-500">${e.category}</p>
                </div>
                <div class="flex gap-2">
                  <button onclick="editExpense('${e.id}')" class="bg-yellow-400 text-white px-3 py-1 rounded hover:bg-yellow-500">Edit</button>
                  <button onclick="deleteExpense('${e.id}')" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">Delete</button>
                </div>
              </li>
            `
          )
          .join("");

        renderPagination(page, totalPages);
      }

      // Add Expense
      expenseForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const newExpense = {
          amount: amount.value,
          description: description.value,
          category: category.value,
        };
        // await axios.post(apiUrl, newExpense);
        expenseForm.reset();
        loadExpenses(currentPage);
      });

      // Edit & Delete (demo only)
      async function editExpense(id) {
        const newDesc = prompt("Enter new description:");
        if (newDesc) alert("Updated expense " + id + " with " + newDesc);
      }
      async function deleteExpense(id) {
        if (confirm("Delete this expense?")) alert("Deleted expense " + id);
      }

      // Pagination Renderer
      function renderPagination(currentPage, totalPages) {
        paginationList.innerHTML = "";

        // Prev button
        const prev = document.createElement("li");
        prev.innerHTML = `<button class="px-3 py-1 border rounded ${
          currentPage === 1
            ? "bg-gray-200 cursor-not-allowed"
            : "bg-teal-600 text-white hover:bg-teal-700"
        }" ${currentPage === 1 ? "disabled" : ""}>Prev</button>`;
        prev.onclick = () => {
          if (currentPage > 1) {
            currentPage--;
            window.history.pushState({}, "", `?page=${currentPage}`);
            loadExpenses(currentPage);
          }
        };
        paginationList.appendChild(prev);

        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
          const li = document.createElement("li");
          li.innerHTML = `<button class="px-3 py-1 border rounded ${
            i === currentPage
              ? "bg-teal-600 text-white"
              : "bg-gray-200 hover:bg-teal-100"
          }">${i}</button>`;
          li.onclick = () => {
            currentPage = i;
            window.history.pushState({}, "", `?page=${i}`);
            loadExpenses(i);
          };
          paginationList.appendChild(li);
        }

        // Next button
        const next = document.createElement("li");
        next.innerHTML = `<button class="px-3 py-1 border rounded ${
          currentPage === totalPages
            ? "bg-gray-200 cursor-not-allowed"
            : "bg-teal-600 text-white hover:bg-teal-700"
        }" ${currentPage === totalPages ? "disabled" : ""}>Next</button>`;
        next.onclick = () => {
          if (currentPage < totalPages) {
            currentPage++;
            window.history.pushState({}, "", `?page=${currentPage}`);
            loadExpenses(currentPage);
          }
        };
        paginationList.appendChild(next);
      }

      // Initial load
      loadExpenses(currentPage);
    </script>
  </body>
</html>
