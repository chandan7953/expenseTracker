<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-teal-50">
    <nav class="bg-teal-700 p-4 flex justify-between items-center text-white">
      <div class="flex items-center space-x-6">
        <h1 class="text-xl font-bold">Expense Tracker</h1>
        <button
          id="homeTab"
          class="font-medium transition-colors hover:text-gray-200 focus:outline-none"
        >
          Home
        </button>
        <button
          id="leaderboardTab"
          class="font-medium transition-colors hover:text-gray-200 focus:outline-none"
        >
          Leaderboard
        </button>
      </div>
      <button
        id="logoutBtn"
        class="bg-white text-teal-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition-all"
      >
        Logout
      </button>
    </nav>
    <section
      id="dashboardSection"
      class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl mt-10 p-8"
    >
      <h3 class="text-xl font-semibold text-teal-600 mb-4">Add Expense</h3>
      <form id="expenseForm" class="grid grid-cols-4 gap-4 items-end mb-8">
        <input
          type="number"
          id="amount"
          name="amount"
          class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none"
          placeholder="Amount"
          required
        />
        <input
          type="text"
          id="description"
          name="description"
          class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none"
          placeholder="Description"
          required
        />
        <select
          id="category"
          name="category"
          class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none"
          required
        >
          <option value="">Category</option>
          <option value="Food">Food</option>
          <option value="Petrol">Petrol</option>
          <option value="Salary">Salary</option>
          <option value="Shopping">Shopping</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
        <button
          type="submit"
          class="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 rounded-lg transition"
        >
          Add
        </button>
      </form>
      <ul id="expenseList" class="space-y-3 mb-8"></ul>
      <nav id="pagination" class="flex justify-center mt-6">
        <ul class="flex space-x-2" id="paginationList"></ul>
      </nav>
    </section>
    <section
      id="proSection"
      class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl mt-10 p-8"
    >
      <!-- Buy Pro card (visible if not Pro) -->
      <div id="buyProCard" class="text-center">
        <h3 class="text-2xl font-semibold text-teal-700 mb-3">
          Unlock Pro Features 🚀
        </h3>
        <p class="text-gray-600 mb-4">
          Get access to the leaderboard and premium features for just ₹199.
        </p>
        <button
          id="buyProBtn"
          class="bg-teal-600 hover:bg-teal-700 text-white font-semibold px-6 py-3 rounded-xl transition-all"
        >
          Buy Pro
        </button>
      </div>
      <!-- Leaderboard (visible if Pro) -->
      <div id="leaderboard" class="">
        <h3 class="text-2xl font-semibold text-teal-700 mb-6 text-center">
          🏆 Top 10 Users by Total Expense
        </h3>
        <ul id="leaderboardList" class="divide-y divide-gray-200"></ul>
      </div>
    </section>
    <script>
      const dashboardSection = document.getElementById("dashboardSection");
      const proSection = document.getElementById("proSection");
      const homeTab = document.getElementById("homeTab");
      const leaderboardTab = document.getElementById("leaderboardTab");

      dashboardSection.classList.remove("hidden");
      proSection.classList.add("hidden");

      function setActive(tab) {
        [homeTab, leaderboardTab].forEach((btn) =>
          btn.classList.remove("border-b-2", "border-red-500", "pb-1")
        );
        tab.classList.add("border-b-2", "border-red-500", "pb-1");
      }

      homeTab.addEventListener("click", () => {
        dashboardSection.classList.remove("hidden");
        proSection.classList.add("hidden");
        setActive(homeTab);
      });

      leaderboardTab.addEventListener("click", () => {
        dashboardSection.classList.add("hidden");
        proSection.classList.remove("hidden");
        setActive(leaderboardTab);
      });

      setActive(homeTab);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./scripts/home.js"></script>
  </body>
</html>
