<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-teal-50">
    <nav class="bg-teal-700 p-4 flex justify-between items-center text-white">
      <h1 class="text-xl font-bold">Dashboard</h1>
      <button
        id="logoutBtn"
        class="bg-white text-teal-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition-all"
      >
        Logout
      </button>
    </nav>

    <section
      id="dashboardSection"
      class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl mt-10 p-8"
    >
      <h3 class="text-xl font-semibold text-teal-600 mb-4">Add Expense</h3>

      <!-- Inline Add Expense Form -->
      <form id="expenseForm" class="grid grid-cols-4 gap-4 items-end mb-8">
        <input
          type="number"
          id="amount"
          name="amount"
          class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none"
          placeholder="Amount"
          required
        />
        <input
          type="text"
          id="description"
          name="description"
          class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none"
          placeholder="Description"
          required
        />
        <select
          id="category"
          name="category"
          class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none"
          required
        >
          <option value="">Category</option>
          <option value="Food">Food</option>
          <option value="Petrol">Petrol</option>
          <option value="Salary">Salary</option>
          <option value="Shopping">Shopping</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
        <button
          type="submit"
          class="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 rounded-lg transition"
        >
          Add
        </button>
      </form>

      <!-- Expenses List -->
      <ul id="expenseList" class="space-y-3 mb-8">
        <!-- Dynamic expense items will appear here -->
      </ul>

      <!-- Pagination -->
      <nav id="pagination" class="flex justify-center mt-6">
        <ul class="flex space-x-2" id="paginationList"></ul>
      </nav>
    </section>

    <!-- ✅ Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./scripts/home.js"></script>
  </body>
</html>
