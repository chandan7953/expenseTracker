<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body class="bg-teal-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <h1 class="text-2xl font-bold text-center mb-6 text-teal-700">
        Reset Password
      </h1>

      <form id="resetForm" class="space-y-4">
        <div>
          <label for="newPassword" class="block text-gray-700 font-medium mb-1">
            New Password
          </label>
          <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-400"
            required
          />
        </div>
        <div>
          <label
            for="confirmPassword"
            class="block text-gray-700 font-medium mb-1"
          >
            Confirm Password
          </label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-400"
            required
          />
        </div>
        <button
          type="submit"
          class="w-full bg-teal-600 text-white p-3 rounded-lg hover:bg-teal-700 transition-all"
        >
          Reset Password
        </button>
      </form>

      <div id="successCard" class="hidden text-center space-y-4 mt-4">
        <p class="text-green-600 font-semibold text-lg">
          ✅ Password Reset Successful
        </p>
        <p class="text-gray-600">You can now log in with your new password.</p>
        <a
          href="login.html"
          class="inline-block bg-teal-600 text-white px-6 py-2 rounded-lg hover:bg-teal-700 transition-all"
        >
          Back to Login
        </a>
      </div>

      <p id="message" class="text-center text-red-500 mt-2"></p>
    </div>
    <script src="./scripts/resetPassword.js"></script>
  </body>
</html>
