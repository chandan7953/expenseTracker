<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-teal-50">
    <div class="bg-white shadow-2xl rounded-2xl w-96 p-8">
      <h2 class="text-2xl font-bold text-center text-teal-700 mb-6">
        Forgot Password
      </h2>
      <form id="forgotPasswordForm" class="space-y-4">
        <input
          type="email"
          name="email"
          placeholder="Enter your registered email"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
          required
        />
        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-teal-600 text-white p-3 rounded-lg hover:bg-teal-700 transition-all flex justify-center items-center gap-2"
        >
          <span id="btnText">Send Reset Link</span>
          <svg
            id="loadingSpinner"
            class="animate-spin h-5 w-5 text-white hidden"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v8H4z"
            ></path>
          </svg>
        </button>
      </form>

      <div id="successCard" class="hidden text-center space-y-4">
        <p class="text-teal-700 font-semibold text-lg">✅ Check your email</p>
        <p class="text-gray-600 text-sm">
          We have sent a password reset link to your email.
        </p>
        <a
          href="login.html"
          class="inline-block bg-teal-600 text-white px-6 py-2 rounded-lg hover:bg-teal-700 transition-all"
        >
          Back to Login
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="./scripts/forgotPassword.js"></script>
  </body>
</html>
